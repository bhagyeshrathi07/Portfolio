<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Scaled and translated to fit perfectly -->
  <!-- We're vertically stretching slightly more to give 'Bebas Neue' its characteristic tall condensed look -->
  <g transform="translate(60, 95) scale(0.9, 1.4)">
    
    <!-- BACKGROUND LETTER B (Light color #f5f5f5) -->
    <!-- Moved B significantly UP (Y = -12) so it sits higher than the R -->
    <g transform="translate(-18, -12)">
      <!-- 3D Concrete Drop Shadow for B -->
      <text x="5" y="5" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#080808" text-anchor="middle">B</text>
      <text x="4" y="4" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#080808" text-anchor="middle">B</text>
      <text x="3" y="3" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#080808" text-anchor="middle">B</text>
      <text x="2" y="2" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#080808" text-anchor="middle">B</text>
      <text x="1" y="1" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#080808" text-anchor="middle">B</text>
      <!-- Main text layer for B -->
      <text x="0" y="0" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#eaddcd" text-anchor="middle">B</text>
    </g>

    <!-- FOREGROUND OVERLAPPING LETTER R (Accent orange #e8573a, italic) -->
    <!-- R is translated down (Y = 5) and further to the right (X = 30) -->
    <g transform="translate(30, 5)">
      <!-- 3D Concrete Drop Shadow for R -->
      <text x="5" y="5" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#080808" text-anchor="middle">R</text>
      <text x="4" y="4" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#080808" text-anchor="middle">R</text>
      <text x="3" y="3" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#080808" text-anchor="middle">R</text>
      <text x="2" y="2" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#080808" text-anchor="middle">R</text>
      <text x="1" y="1" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#080808" text-anchor="middle">R</text>
      <!-- Main text layer for R -->
      <text x="0" y="0" font-family="'Bebas Neue', Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#e8573a" text-anchor="middle">R</text>
    </g>

  </g>
</svg>
